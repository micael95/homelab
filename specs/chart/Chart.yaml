apiVersion: v2
name: homelab-k3s
description: Helm chart for deploying Home lab on k3s with Raspberry Pi OS.
type: application
version: 0.1.0
appVersion: "1.0"

dependencies:
  - name: n8n
    version: 0.20.0
    repository: oci://8gears.container-registry.com/library
    condition: n8n.enabled
  - name: postgresql
    version: 16.7.15
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: postgresql.enabled
  - name: nextcloud
    version: 6.6.10
    repository: https://nextcloud.github.io/helm/
    condition: nextcloud.enabled
  # - name: adguard-home
  #   version: 4.5.2
  #   repository: https://k8s-at-home.com/charts/
